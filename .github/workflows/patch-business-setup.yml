name: apply business setup wiring
on:
  push:
    branches: [feat/business-modes-polish]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch StoreAccess business choices
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/StoreAccess.tsx')
          s = p.read_text()

          old = '''const CATEGORIES: { id: StoreCategory; label: string; icon: string; desc: string }[] = [
            { id: 'retail', label: 'Retail Store', icon: '🛒', desc: 'Products, inventory and sales' },
            { id: 'restaurant', label: 'Restaurant', icon: '🍽️', desc: 'Menu items and orders' },
            { id: 'games', label: 'Games & Entertainment', icon: '🎮', desc: 'PlayStation, Snooker, etc.' },
            { id: 'other', label: 'Other', icon: '🏪', desc: 'Custom setup' },
          ];'''
          new = '''const CATEGORIES: { id: StoreCategory; label: string; icon: string; desc: string }[] = [
            { id: 'retail', label: 'Retail & Shop', icon: '🛒', desc: 'Products, inventory and sales' },
            { id: 'restaurant', label: 'Restaurant & Food', icon: '🍽️', desc: 'Menu items, orders and delivery' },
            { id: 'games', label: 'Games & Entertainment', icon: '🎮', desc: 'Gaming, sessions and bookings' },
            { id: 'other', label: 'Services & Other', icon: '🛠️', desc: 'Barber, laundry, tailoring and more' },
          ];'''
          if old not in s: raise SystemExit('CATEGORIES block not found')
          s=s.replace(old,new)

          old = "const [retailType, setRetailType] = useState('provision_retail');"
          new = "const [retailType, setRetailType] = useState('provision_retail');\n  const [businessType, setBusinessType] = useState('provision');"
          if old not in s: raise SystemExit('retailType state not found')
          s=s.replace(old,new)

          old = '''  const retailTypeToStoreType = (rt: string): StoreType => {
    switch (rt) {
      case 'clothing': return 'clothing';
      case 'food': return 'food';
      case 'electronics': return 'electronics';
      case 'laundry': return 'laundry';
      case 'gasoline': return 'gas_filling';
      case 'provision_retail':
      case 'provision_wholesale':
        return 'provision';
      default: return 'provision';
    }
  };'''
          new = '''  const retailTypeToStoreType = (rt: string): StoreType => {
    switch (rt) {
      case 'clothing': return 'clothing';
      case 'food': return 'food';
      case 'electronics': return 'electronics';
      case 'laundry': return 'laundry';
      case 'gasoline': return 'gas_filling';
      case 'provision_retail':
      case 'provision_wholesale':
        return 'provision';
      default: return 'provision';
    }
  };

  const BUSINESS_CHOICES = [
    ['provision', 'Provision / Supermarket', '🛒'],
    ['pharmacy', 'Pharmacy / Chemist', '💊'],
    ['laundry', 'Laundry / Dry Cleaning', '🧺'],
    ['gas_filling', 'Gas Filling', '⛽'],
    ['games', 'Gaming Centre', '🎮'],
    ['barber', 'Barber Shop', '💈'],
    ['salon', 'Salon / Beauty', '💇‍♀️'],
    ['tailoring', 'Tailoring / Fashion Design', '🧵'],
    ['repair', 'Repair Shop', '🛠️'],
    ['printing', 'Printing / Cyber Cafe', '🖨️'],
    ['car_wash', 'Car Wash', '🚗'],
    ['photography', 'Photography', '📸'],
    ['cleaning', 'Cleaning Service', '🧹'],
    ['spa', 'Spa / Wellness', '🧖'],
    ['clothing', 'Clothing / Fashion', '👕'],
    ['electronics', 'Electronics', '📱'],
    ['restaurant', 'Restaurant / Food', '🍔'],
  ] as const;

  const businessCategory = (type: string): StoreCategory => {
    if (type === 'games') return 'games';
    if (type === 'restaurant' || type === 'food') return 'restaurant';
    if (['barber','salon','tailoring','repair','printing','car_wash','photography','cleaning','spa','laundry','gas_filling'].includes(type)) return 'other';
    return 'retail';
  };'''
          if old not in s: raise SystemExit('mapping block not found')
          s=s.replace(old,new)

          old = '''        storeName: storeName.trim(),
        category,
        retailType: category === 'retail' ? retailType : undefined,
        storeType: category === 'retail' ? retailTypeToStoreType(retailType) : category,
        profile: { ...(loadedStore.profile || {}), logoStyle: selectedLogoStyle },'''
          new = '''        storeName: storeName.trim(),
        category: businessCategory(businessType),
        retailType: businessType,
        storeType: (businessType === 'games' ? 'games' : businessType === 'restaurant' ? 'restaurant' : businessType) as StoreType,
        profile: { ...(loadedStore.profile || {}), logoStyle: selectedLogoStyle },
        ...( { businessType } as any ),'''
          if old not in s: raise SystemExit('loaded store assignment not found')
          s=s.replace(old,new)

          old = '''    const store = createStore(
      storeName.trim(),
      category,
      category === 'retail' ? retailType : undefined,
      selectedLogoStyle,
      category === 'retail' ? retailTypeToStoreType(retailType) : (category as StoreType)
    );
    setNewCode(store.accessCode);'''
          new = '''    const store = createStore(
      storeName.trim(),
      businessCategory(businessType),
      businessType,
      selectedLogoStyle,
      (businessType === 'games' ? 'games' : businessType === 'restaurant' ? 'restaurant' : businessType) as StoreType
    );
    (store as any).businessType = businessType;
    saveStore(store);
    setNewCode(store.accessCode);'''
          if old not in s: raise SystemExit('createStore call not found')
          s=s.replace(old,new)

          start = '''            {category === 'retail' && (
              <div className="space-y-1">'''
          marker = '''            <div className="space-y-1">
              <label className="block text-xs text-muted-foreground uppercase font-bold mb-1">Select Store Logo Concept</label>'''
          si=s.find(start)
          if si < 0: raise SystemExit('retail UI start not found')
          ei=s.find(marker, si)
          if ei < 0: raise SystemExit('logo UI marker not found')
          replacement='''            <div className="space-y-2">
              <label className="block text-xs text-muted-foreground uppercase font-bold">What kind of business do you run?</label>
              <div className="grid grid-cols-2 gap-2">
                {BUSINESS_CHOICES.map(([id, label, icon]) => (
                  <button
                    key={id}
                    type="button"
                    onClick={() => {
                      setBusinessType(id);
                      setCategory(businessCategory(id));
                      setRetailType(id);
                      setAccessMood('thinking');
                    }}
                    className={`p-3 rounded-xl border text-left transition-all cursor-pointer ${businessType === id ? 'bg-primary/10 border-primary ring-1 ring-primary/20' : 'bg-surface-2 border-border hover:border-primary/30'}`}
                  >
                    <div className="text-xl mb-1">{icon}</div>
                    <p className="font-display font-semibold text-xs text-foreground leading-tight">{label}</p>
                  </button>
                ))}
              </div>
              <p className="text-[10px] text-muted-foreground">Pick the closest match. Manchant will prepare the right dashboard, customer flow and setup automatically.</p>
            </div>
'''
          s=s[:si]+replacement+s[ei:]
          p.write_text(s)

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StoreAccess.tsx
          git rm .github/workflows/patch-business-setup.yml
          git commit -m "feat: add business choices to store creation [skip ci]"
          git push
