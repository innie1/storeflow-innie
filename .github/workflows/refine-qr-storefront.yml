name: Refine QR Storefront UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-qr:
    if: ${{ !contains(github.event.head_commit.message, '[skip qr refine]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch QR storefront UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/Settings.tsx')
          text = path.read_text()
          original = text

          # Remove the manual refresh control: the storefront URL is deterministic,
          # so the QR does not need a user-facing refresh button.
          text = re.sub(
              r'\n\s*<button\n\s*onClick=\{handleManualQRRefresh\}[\s\S]*?</button>',
              '',
              text,
              count=1,
          )

          # Remove the fake analytics/placeholder section entirely. Analytics should
          # only return when backed by real scan telemetry.
          text = re.sub(
              r'\n\s*\{\/\* Analytics Section \*\/\}[\s\S]*?\n\s*\{\/\* Product QR Codes Section \*\/\}',
              '\n\n          {/* Product QR Codes Section */}',
              text,
              count=1,
          )

          # Remove the static "live product statistics" cards; the QR page should
          # focus on publishing/scanning rather than duplicating dashboard metrics.
          text = re.sub(
              r'\n\s*\{\/\* Live Store Stats Grid \*\/\}[\s\S]*?\n\s*\{\/\* Store Information Summary \*\/\}',
              '\n\n          {/* Store Information Summary */}',
              text,
              count=1,
          )

          # Make the storefront wording work for both products and services.
          text = text.replace(
              'Scan with a mobile camera to browse products and buy directly.',
              "Scan with a mobile camera to open this store in the customer app.",
          )
          text = text.replace(
              '<span>Browse Products</span>',
              "<span>{serviceBusiness ? 'View Services' : 'Browse Products'}</span>",
          )
          text = text.replace(
              '<span>Order Instantly</span>',
              "<span>{serviceBusiness ? 'Request a Service' : 'Order Instantly'}</span>",
          )
          text = text.replace(
              '<span>Pay Securely</span>',
              '<span>Pay Securely</span>',
          )
          text = text.replace(
              '<span>Pickup or Delivery</span>',
              "<span>{serviceBusiness ? 'Choose Pickup / Delivery' : 'Pickup or Delivery'}</span>",
          )

          # Product QR area also covers named services because service offerings
          # use the same product record with isService=true.
          text = text.replace(
              '>Product QR Codes</h3>',
              ">{serviceBusiness ? 'Product & Service QR Codes' : 'Product QR Codes'}</h3>",
              1,
          )
          text = text.replace(
              'Print secure tag labels for inventory tracking.',
              "Print a customer QR for a product or service.",
              1,
          )
          text = text.replace(
              'Products automatically receive QR Codes and optional Barcodes after creation.',
              "Products and named services can receive a customer QR after creation.",
              1,
          )

          # Service rows should not present stock as the primary state.
          text = text.replace(
              "<span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-display font-bold ${\n                isOutOfStock \n                  ? 'bg-destructive/10 text-destructive border border-destructive/20' \n                  : 'bg-success/10 text-success border border-success/20'\n              }`}>\n                {isOutOfStock ? '🔴 Out of Stock' : `🟢 In Stock (${product.quantity})`}\n              </span>",
              "{product.isService ? (\n                <span className=\"inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-display font-bold bg-primary/10 text-primary border border-primary/20\">\n                  🛠️ Service\n                </span>\n              ) : (\n                <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-display font-bold ${\n                  isOutOfStock\n                    ? 'bg-destructive/10 text-destructive border border-destructive/20'\n                    : 'bg-success/10 text-success border border-success/20'\n                }`}>\n                  {isOutOfStock ? '🔴 Out of Stock' : `🟢 In Stock (${product.quantity})`}\n                </span>\n              )}",
              1,
          )
          text = text.replace(
              '<span className="text-[9px] text-muted-foreground font-display font-bold">Scan to buy · Tap to close</span>',
              '<span className="text-[9px] text-muted-foreground font-display font-bold">{product.isService ? \'Scan to view service · Tap to close\' : \'Scan to buy · Tap to close\'}</span>',
              1,
          )

          # Hide QR-only inventory messaging for service businesses.
          text = text.replace(
              "<button\n          onClick={() => setScannerOpen(true)}",
              "<button\n          onClick={() => setScannerOpen(true)}",
              1,
          )

          if text == original:
              raise SystemExit('QR patch made no changes; aborting to avoid a false-success commit.')

          path.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit refined UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Settings.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: simplify QR storefront settings [skip qr refine]"
          git push
