name: Apply Flow sale confirmation patch

on:
  push:
    branches: [fix/flow-sale-confirmation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Flow sale confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/FlowChat.tsx')
          s = p.read_text()
          old = "    if (plan.intent === 'sell') { executeSales(plan.items); return; }"
          new = """    if (plan.intent === 'sell') {
          if (!plan.items.length) { executeSales(plan.items); return; }
          const saleSummary = plan.items.map(item => `${item.quantity} × ${item.product.product.name}`).join(', ');
          flow(`**Confirm sale**\\n\\nSell **${saleSummary}**?\\nThis will record the sale and update your store records.`, [
            { label: 'Yes, sell', onClick: () => executeSales(plan.items) },
            { label: 'Cancel', onClick: () => flow('Sale cancelled.') },
          ]);
          return;
        }"""
          if old not in s:
              raise SystemExit('Expected sell execution block was not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FlowChat.tsx
          git commit -m 'fix(flow): confirm sales before execution'
          git push
