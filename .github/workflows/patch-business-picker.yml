name: business onboarding patcher
on:
  push:
    branches: [feat/business-modes-polish]
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feat/business-modes-polish' || github.event.pull_request.head.ref == 'feat/business-modes-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-modes-polish
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch StoreAccess
        run: python .github/patch_business_picker.py
      - name: Commit patched StoreAccess
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StoreAccess.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add complete business choices to store creation"
          git push origin HEAD:feat/business-modes-polish
