name: build-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify required Vite config
        shell: bash
        run: |
          test -f .env || { echo "Missing .env required by the current Vercel/Vite build"; exit 1; }
          for key in VITE_SUPABASE_PROJECT_ID VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_URL; do
            value="$(grep -E "^${key}=" .env | head -1 | cut -d= -f2- | tr -d '"' | xargs)"
            test -n "$value" || { echo "Missing required ${key}"; exit 1; }
          done
      - run: npm ci
      # `npm run build` is vite only - it strips the types without checking
      # them, so nothing here ever read them. The root tsconfig cannot do it
      # either: it has `files: []` and only project references, so `tsc -p
      # tsconfig.json` exits clean over any number of real errors. It was
      # sitting on 255 of them, several of which were live bugs.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
