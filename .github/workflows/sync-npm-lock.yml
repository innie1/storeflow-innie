name: Apply tray reset and refresh reliability fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Reset per-record payment state but keep due date
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/laundry/LaundryWalkInIntakeV3.tsx')
          s = p.read_text()
          old = "  const reset = () => {\n    setCustomerName('');"
          new = "  const reset = () => {\n    // Everything belonging to the previous customer/order must start clean.\n    // The due date is the one intentional exception: promisedFor and\n    // promisedTouched stay untouched until the merchant changes them.\n    setPaidNow('');\n    setPaidTouched(false);\n    setShowSuggestions(false);\n    setAskingNumber(false);\n    setLateNumber('');\n    setGarmentSearch('');\n    setSimilarGarment(null);\n    setPickingCustom(false);\n    setShowTicket(false);\n    setCustomerName('');"
          if old not in s:
              raise SystemExit('Laundry reset anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Prevent stale HTML from causing a blank first refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/sw.ts')
          s = p.read_text()
          start_marker = "/*\n * Five seconds, not two."
          next_marker = "registerRoute(({ request }) => ['style','script','worker','image','font'].includes(request.destination)"
          start = s.find(start_marker)
          end = s.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Service-worker navigation strategy anchor not found')
          replacement = "/*\n * Always prefer the current HTML when the network is available. A navigation\n * timeout could serve an older cached shell whose hashed JavaScript chunks no\n * longer exist on the current deployment, leaving a blank screen until the\n * next refresh. NetworkFirst still falls back to cached HTML when the network\n * actually fails, so installed shops keep their offline start.\n */\nregisterRoute(({ request }) => request.mode === 'navigate', new NetworkFirst({ cacheName: 'html' }));\n"
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Commit fixes and restore normal workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/sync-npm-lock.yml > .github/workflows/sync-npm-lock.yml
          git add src/components/laundry/LaundryWalkInIntakeV3.tsx src/sw.ts .github/workflows/sync-npm-lock.yml
          git commit -m "Reset laundry payment fields and prevent blank refreshes"
          git push origin HEAD:main