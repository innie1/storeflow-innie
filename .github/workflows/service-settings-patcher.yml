name: temporary service settings patcher
on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'feat/service-business-settings' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Settings
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/Settings.tsx'); s=p.read_text()
          anchor="export default function Settings({ store, onUpdate, onLock, currentUser, isActive = true }: SettingsProps) {"
          insert="""
          const isServiceBusiness = ['laundry','barber','salon','tailoring','repair','printing','cyber_cafe','car_wash','photography','cleaning','spa','games','gaming','restaurant'].includes(String((store as any)?.storeType || (store as any)?.category || (store as any)?.businessTemplate?.type || (store as any)?.data?.businessTemplate?.type || '').toLowerCase()) || (Array.isArray((store as any)?.businessTemplate?.modes) && (store as any).businessTemplate.modes.includes('services')) || (Array.isArray((store as any)?.data?.businessTemplate?.modes) && (store as any).data.businessTemplate.modes.includes('services'));
          """
          if 'const isServiceBusiness =' not in s:
              if anchor not in s: raise SystemExit('settings anchor missing')
              s=s.replace(anchor,anchor+'\n'+insert,1)
          old="""  const setView = (newView: View) => {
    setViewStack(prev => {"""
          new="""  const setView = (newView: View) => {
    if (newView === 'inventory' && isServiceBusiness) return;
    setViewStack(prev => {"""
          if old not in s: raise SystemExit('setView anchor missing')
          s=s.replace(old,new,1)
          old='<ToggleRow label="Low Stock Alerts" checked={mgr.notifyLowStock} onChange={v => updateMgr({ notifyLowStock: v })} />'
          new='{!isServiceBusiness && (<ToggleRow label="Low Stock Alerts" checked={mgr.notifyLowStock} onChange={v => updateMgr({ notifyLowStock: v })} />)}'
          if old in s: s=s.replace(old,new,1)
          old='<span>Browse Products</span>'
          new="<span>{isServiceBusiness ? 'Browse Services' : 'Browse Products'}</span>"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
      - name: Build
        run: npm ci && npm run build
      - name: Commit and remove branch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Settings.tsx
          git commit -m "feat: hide inventory settings for service businesses"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}