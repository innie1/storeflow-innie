name: Clean Buy List patch files
on:
  push:
    branches: [fix/buy-list-simple-mode]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/buy-list-fix-trigger.txt src/lib/.buy-list-fix-note .github/workflows/cleanup-buy-list-fix.yml
          git add -A
          git commit -m "chore: remove temporary Buy List patch files"
          git push
