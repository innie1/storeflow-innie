name: Wire Flow attachments into source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'feat(flow): permanently wire Flow attachments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch FlowChat and ReceiptScanner
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/FlowChat.tsx')
          s = p.read_text()

          imports = "import { createFlowBuyList, formatFlowBuyList } from '@/lib/flow-buy-list';\nimport FlowAttachmentMenu from '@/components/FlowAttachmentMenu';\nimport FlowCameraCapture from '@/components/FlowCameraCapture';"
          if "@/components/FlowAttachmentMenu" not in s:
              anchor = "import ReceiptScanner from '@/components/ReceiptScanner';"
              if anchor not in s:
                  raise SystemExit('FlowChat import anchor not found')
              s = s.replace(anchor, anchor + "\n" + imports, 1)

          state_anchor = "  const [showReceiptImport, setShowReceiptImport] = useState(false);"
          state = "  const [showAttachments, setShowAttachments] = useState(false);\n  const [showFlowCamera, setShowFlowCamera] = useState(false);\n  const [pendingImportFile, setPendingImportFile] = useState<File | null>(null);"
          if 'const [showAttachments, setShowAttachments]' not in s:
              if state_anchor not in s:
                  raise SystemExit('FlowChat state anchor not found')
              s = s.replace(state_anchor, state_anchor + "\n" + state, 1)

          helper = '''
  const createBuyListFromFlow = () => {
    const items = createFlowBuyList(store);
    flow(formatFlowBuyList(items), items.length ? [{ label: 'Open Buy List', onClick: () => onNavigate?.('inventory') }] : undefined);
    rememberBrainContext(store, { lastTopic: 'inventory', lastAction: 'flow buy list recommendation' });
  };

  const handleFlowAttachment = (file: File) => {
    if (file.type.startsWith('image/')) {
      setPendingImportFile(file);
      setShowReceiptImport(true);
      return;
    }
    const ext = file.name.split('.').pop()?.toLowerCase() || '';
    if (['pdf', 'doc', 'docx', 'xls', 'xlsx', 'csv', 'tsv', 'txt', 'json'].includes(ext)) {
      showToast(`${file.name} selected. Open Inventory to import this stock file.`, 'info');
      onNavigate?.('inventory');
      return;
    }
    showToast('That file type is not supported for StoreFlow import.', 'error');
  };
'''
          if 'const createBuyListFromFlow' not in s:
              anchor = '  const importRestockCode = () => {'
              if anchor not in s:
                  raise SystemExit('FlowChat helper anchor not found')
              s = s.replace(anchor, helper + "\n" + anchor, 1)

          command_anchor = "    if (handleFinanceMutation(text)) return;"
          command = "    if (/\\b(?:create|make|build|generate)\\b.*\\bbuy list\\b|\\bbuy list\\b.*\\b(?:create|make|build|generate)\\b/i.test(text)) { createBuyListFromFlow(); return; }\n"
          if 'createBuyListFromFlow(); return;' not in s:
              if command_anchor not in s:
                  raise SystemExit('FlowChat command anchor not found')
              s = s.replace(command_anchor, command + command_anchor, 1)

          old_form = '''    {showReceiptImport && <ReceiptScanner store={store} onUpdate={onUpdate} onClose={() => setShowReceiptImport(false)} />}
    <form className="flex items-center gap-2 px-4 py-3 border-t border-border" onSubmit={e => { e.preventDefault(); const t = input.trim(); if (!t) return; setInput(''); ask(t); }}><input value={input} onChange={e => setInput(e.target.value)} placeholder={addDraft ? 'Answer Flow…' : 'Tell Flow what to do…'} className="flex-1 rounded-full border border-border bg-surface-2/40 px-4 py-3 text-sm" /><button type="submit" disabled={!input.trim()} className="w-11 h-11 flex items-center justify-center rounded-full bg-primary text-primary-foreground disabled:opacity-40" aria-label="Send"><Send className="w-4 h-4" /></button></form>'''
          new_form = '''    {showReceiptImport && <ReceiptScanner store={store} onUpdate={onUpdate} onClose={() => { setShowReceiptImport(false); setPendingImportFile(null); }} initialFile={pendingImportFile} />}
    {showFlowCamera && <FlowCameraCapture onClose={() => setShowFlowCamera(false)} onCapture={(file) => { setShowFlowCamera(false); setPendingImportFile(file); setShowReceiptImport(true); }} />}
    <form className="relative flex items-center gap-2 px-4 py-3 border-t border-border" onSubmit={e => { e.preventDefault(); const t = input.trim(); if (!t) return; setInput(''); ask(t); }}>
      <button type="button" onClick={() => setShowAttachments(v => !v)} className="w-10 h-10 shrink-0 flex items-center justify-center rounded-full border border-border bg-surface-2/40" aria-label="Add attachment">
        <Plus className="w-5 h-5" />
      </button>
      <input value={input} onChange={e => setInput(e.target.value)} placeholder={addDraft ? 'Answer Flow…' : 'Tell Flow what to do…'} className="flex-1 rounded-full border border-border bg-surface-2/40 px-4 py-3 text-sm" />
      <button type="submit" disabled={!input.trim()} className="w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-primary text-primary-foreground disabled:opacity-40" aria-label="Send">
        <Send className="w-4 h-4" />
      </button>
      {showAttachments && <FlowAttachmentMenu
        onClose={() => setShowAttachments(false)}
        onCamera={() => { setShowAttachments(false); setShowFlowCamera(true); }}
        onImage={handleFlowAttachment}
        onFile={handleFlowAttachment}
        onRestockCode={() => { setShowAttachments(false); setShowRestockCodeImport(true); }}
        onBuyList={() => { setShowAttachments(false); createBuyListFromFlow(); }}
      />}
    </form>'''
          if '<FlowAttachmentMenu' not in s:
              if old_form not in s:
                  raise SystemExit('FlowChat form anchor not found')
              s = s.replace(old_form, new_form, 1)

          p.write_text(s)

          r = Path('src/components/ReceiptScanner.tsx')
          rs = r.read_text()
          if 'initialFile?: File | null;' not in rs:
              rs = rs.replace('  currentUser?: any;\n}', '  currentUser?: any;\n  initialFile?: File | null;\n}', 1)
          if 'currentUser, initialFile' not in rs:
              rs = rs.replace('export default function ReceiptScanner({ store, onUpdate, onClose, currentUser }: ReceiptScannerProps) {', 'export default function ReceiptScanner({ store, onUpdate, onClose, currentUser, initialFile }: ReceiptScannerProps) {', 1)
          if 'initialProcessedRef' not in rs:
              rs = rs.replace('  const fileRef = useRef<HTMLInputElement>(null);', '  const fileRef = useRef<HTMLInputElement>(null);\n  const initialProcessedRef = useRef<File | null>(null);', 1)
          if 'initialFile && initialProcessedRef' not in rs:
              anchor = '  const applyStructureToItems = (targetItems: ScannedItem[], pUnit: string, sUnit: string, unitsPerPurchase: number) => {'
              effect = '''  useEffect(() => {
    if (!initialFile || initialProcessedRef.current === initialFile) return;
    initialProcessedRef.current = initialFile;
    const synthetic = { target: { files: [initialFile] } } as unknown as React.ChangeEvent<HTMLInputElement>;
    void handleFileSelect(synthetic);
  }, [initialFile]);

'''
              if anchor not in rs:
                  raise SystemExit('ReceiptScanner anchor not found')
              rs = rs.replace(anchor, effect + anchor, 1)
          r.write_text(rs)

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit permanent wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FlowChat.tsx src/components/ReceiptScanner.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "feat(flow): permanently wire Flow attachments"
          git push
