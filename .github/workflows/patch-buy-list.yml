name: Apply Buy List manual-open fix

on:
  push:
    branches: [fix/manual-buy-list]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Buy List behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Inventory.tsx')
          s = p.read_text()
          old = '''  const generateBuyList = () => {\n    // Items needing restock: out of stock first, then low stock, sorted by quantity ascending\n    const needing = store.products\n      .filter(p => p.quantity <= lowThreshold)\n      .sort((a, b) => a.quantity - b.quantity);\n    if (needing.length === 0) {\n      showToast('No items below threshold', 'error');\n      return;\n    }\n    const items: ShoppingListItem[] = needing.map(p => {\n      const target = Math.max(lowThreshold * 4, 10);\n      const suggested = Math.max(1, target - p.quantity);\n      return { productId: p.id, name: p.name, quantity: suggested, category: p.category };\n    });\n    // Merge with any existing list (replace duplicates with suggested qty)\n    const existingIds = new Set(items.map(i => i.productId));\n    const merged = [...items, ...shoppingList.filter(i => !existingIds.has(i.productId))];\n    setShoppingList(merged);\n    setShowShoppingList(true);\n    showToast(`${items.length} items added to buy list`);\n  };'''
          new = '''  const generateBuyList = () => {\n    // Buy List opens the manual/simple restock screen only.\n    // Do NOT copy low-stock items or pre-populate selections here.\n    // Automatic recommendations and budget allocation belong exclusively to Smart Restock.\n    setShowShoppingList(true);\n  };'''
          if old not in s:
              raise SystemExit('Expected generateBuyList block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Inventory.tsx
          git diff --cached --quiet || git commit -m 'fix(inventory): make Buy List open manual mode without auto-generating'
          git push
