name: apply business picker
on:
  push:
    branches: [feat/business-modes-polish]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire all business types into store creation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-modes-polish
          fetch-depth: 1
      - name: Patch business picker and routing
        run: |
          python - <<'PY'
          from pathlib import Path

          access = Path('src/components/StoreAccess.tsx')
          text = access.read_text()

          old_map = """      case 'clothing': return 'clothing';
      case 'food': return 'food';
      case 'electronics': return 'electronics';
      case 'laundry': return 'laundry';
      case 'gasoline': return 'gas_filling';
      case 'provision_retail':
      case 'provision_wholesale':
        return 'provision';
      default: return 'provision';"""
          new_map = """      case 'clothing': return 'clothing';
      case 'food': return 'food';
      case 'electronics': return 'electronics';
      case 'pharmacy': return 'pharmacy';
      case 'laundry': return 'laundry';
      case 'gasoline': return 'gas_filling';
      case 'barber': return 'barber';
      case 'salon': return 'salon';
      case 'tailoring': return 'tailoring';
      case 'repair': return 'repair';
      case 'printing': return 'printing';
      case 'cyber_cafe': return 'cyber_cafe';
      case 'car_wash': return 'car_wash';
      case 'photography': return 'photography';
      case 'cleaning': return 'cleaning';
      case 'spa': return 'spa';
      case 'provision_retail':
      case 'provision_wholesale':
      case 'other':
        return 'provision';
      default: return 'provision';"""
          if old_map not in text:
              raise SystemExit('retailTypeToStoreType anchor not found')
          text = text.replace(old_map, new_map, 1)

          old_options = """                  <option value=\"provision_retail\">Sales of Provision (Retail Provision)</option>
                  <option value=\"provision_wholesale\">Wholesale for Provision</option>
                  <option value=\"pharmacy\">Pharmacy / Chemist</option>
                  <option value=\"electronics\">Electronics Store</option>
                  <option value=\"clothing\">Clothing / Fashion</option>
                  <option value=\"food\">Food / Provisions Supplier</option>
                  <option value=\"laundry\">Laundry / Dry Cleaning</option>
                  <option value=\"gasoline\">Gasoline / Gas Filling Station</option>
                  <option value=\"other\">Other / General Retail</option>"""
          new_options = """                  <option value=\"provision_retail\">Provision / Supermarket</option>
                  <option value=\"provision_wholesale\">Provision Wholesale</option>
                  <option value=\"pharmacy\">Pharmacy / Chemist</option>
                  <option value=\"electronics\">Electronics</option>
                  <option value=\"clothing\">Clothing / Fashion</option>
                  <option value=\"food\">Food Business</option>
                  <option value=\"laundry\">Laundry</option>
                  <option value=\"gasoline\">Gas Filling</option>
                  <option value=\"barber\">Barber Shop</option>
                  <option value=\"salon\">Salon / Beauty</option>
                  <option value=\"tailoring\">Tailoring</option>
                  <option value=\"repair\">Repair Shop</option>
                  <option value=\"printing\">Printing / Cyber Cafe</option>
                  <option value=\"cyber_cafe\">Cyber Cafe</option>
                  <option value=\"car_wash\">Car Wash</option>
                  <option value=\"photography\">Photography</option>
                  <option value=\"cleaning\">Cleaning Service</option>
                  <option value=\"spa\">Spa / Wellness</option>
                  <option value=\"other\">Other Business</option>"""
          if text.count(old_options) < 2:
              raise SystemExit(f'expected 2 retail option blocks, found {text.count(old_options)}')
          text = text.replace(old_options, new_options)
          access.write_text(text)

          types = Path('src/types/store.ts')
          t = types.read_text()
          old_type = "export type StoreType = 'provision' | 'clothing' | 'food' | 'electronics' | 'laundry' | 'gas_filling' | 'restaurant' | 'games' | 'other';"
          new_type = "export type StoreType = 'provision' | 'pharmacy' | 'clothing' | 'food' | 'electronics' | 'laundry' | 'gas_filling' | 'restaurant' | 'games' | 'barber' | 'salon' | 'tailoring' | 'repair' | 'printing' | 'cyber_cafe' | 'car_wash' | 'photography' | 'cleaning' | 'spa' | 'other';"
          if old_type not in t:
              raise SystemExit('StoreType anchor not found')
          types.write_text(t.replace(old_type, new_type, 1))

          dash = Path('src/components/Dashboard.tsx')
          d = dash.read_text()
          old_list = """    'laundry',
    'gas_filling',
    'restaurant',
    'food',
    'clothing',
    'electronics',
    'games',
    'other',"""
          new_list = """    'laundry',
    'gas_filling',
    'restaurant',
    'food',
    'clothing',
    'electronics',
    'pharmacy',
    'barber',
    'salon',
    'tailoring',
    'repair',
    'printing',
    'cyber_cafe',
    'car_wash',
    'photography',
    'cleaning',
    'spa',
    'games',
    'other',"""
          if old_list not in d:
              raise SystemExit('Dashboard business list anchor not found')
          dash.write_text(d.replace(old_list, new_list, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StoreAccess.tsx src/types/store.ts src/components/Dashboard.tsx
          git diff --cached --quiet || git commit -m "feat: add full business type picker"
          git push origin feat/business-modes-polish
