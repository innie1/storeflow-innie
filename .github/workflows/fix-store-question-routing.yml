name: Fix Flow Store Question Routing

on:
  push:
    branches: [fix/store-question-routing]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Flow Brain routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/flow-brain.ts')
          text = path.read_text()

          marker = "  if(/\\b(?:how'?s|how is|tell me about|give me an overview of)\\s+(?:my\\s+)?(?:store|business|shop)\\b|\\bmy store\\b.*\\b(?:doing|performance|health)\\b/.test(q))"
          replacement = "  if(/^(?:how'?s|how is|how are|tell me about|give me an overview of|give me a summary of|what is the state of)\\s+(?:(?:my|the)\\s+)?(?:store|business|shop)\\b|\\b(?:how are we doing|how is the business doing|how is the shop doing)\\b/.test(q))"

          if marker not in text:
              raise SystemExit('Expected store-overview routing rule was not found; aborting.')

          text = text.replace(marker, replacement, 1)

          # Add an explicit guard before product matching so a store-level
          # question can never fall through to resolveProduct(), even when
          # a product name happens to appear in UI context.
          guard = "  if(/^(?:how'?s|how is|how are|tell me about|give me an overview of|give me a summary of|what is the state of)\\s+(?:(?:my|the)\\s+)?(?:store|business|shop)\\b|\\b(?:how are we doing|how is the business doing|how is the shop doing)\\b/.test(q))return{intent:'store_overview',confidence:.99,needsConfirmation:false,reason:'store-level question'};\n"
          product_line = "  const p=resolveProduct(store,text)||mentioned(store,text);"
          if guard not in text:
              if product_line not in text:
                  raise SystemExit('Product fallback marker was not found; aborting.')
              text = text.replace(product_line, guard + product_line, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-store-question-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/flow-brain.ts .github/workflows/fix-store-question-routing.yml
          git commit -m 'fix(flow): prioritize store-level questions over product matching'
          git push
